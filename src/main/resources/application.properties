spring.application.name=picknquicks
spring.docker.compose.enabled=false

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

resend.api-key=${RESEND_API_KEY:dummy-api-key}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
resend.from-name=${RESEND_FROM_NAME:PickNQuicks}

app.frontend-url=${FRONTEND_URL}
app.backend-url=${BACKEND_URL}
app.oauth2.redirect-uri=${FRONTEND_URL}/auth/oauth2/redirect

server.port=8080

app.file-storage.base-path=uploads
app.file-storage.avatar-path=avatars
app.file-storage.product-path=products
app.file-storage.category-path=categories
app.file-storage.max-file-size=10485760
app.file-storage.allowed-mime-types=image/jpeg,image/png,image/gif,image/webp

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.root=INFO
logging.level.com.picknquicks=DEBUG

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
