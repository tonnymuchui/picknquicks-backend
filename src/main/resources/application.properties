spring.application.name=picknquicks-api
spring.docker.compose.enabled=false

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:pnq}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.order_inserts=true
spring.jpa.properties.hibernate.jdbc.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

spring.data.redis.host=${REDIS_HOST:redis-14376.c1.us-central1-2.gce.cloud.redislabs.com}
spring.data.redis.port=${REDIS_PORT:14376}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2000ms
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

spring.elasticsearch.uris=${ELASTICSEARCH_PROTOCOL:https}://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}
spring.data.elasticsearch.cluster-name=picknquicks
spring.data.elasticsearch.cluster-nodes=${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}
elasticsearch.username=${ELASTICSEARCH_USERNAME:elastic}
elasticsearch.password=${ELASTICSEARCH_PASSWORD:changeme}
spring.data.elasticsearch.client.reactive.use-ssl=false
spring.data.elasticsearch.client.reactive.socket-keep-alive=true


spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=picknquicks-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.admin.auto-create=false

spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

resend.api-key=${RESEND_API_KEY:dummy-api-key}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@picknquicks.com}
resend.from-name=${RESEND_FROM_NAME:Picknquicks}

app.frontend-url=${FRONTEND_URL}
app.backend-url=${BACKEND_URL}
app.oauth2.redirect-uri=${FRONTEND_URL}/auth/oauth2/redirect

app.file-storage.base-path=uploads
app.file-storage.avatar-path=avatars
app.file-storage.product-path=products
app.file-storage.category-path=categories
app.file-storage.max-file-size=10485760
app.file-storage.allowed-mime-types=image/jpeg,image/png,image/gif,image/webp

mpesa.consumer-key=${MPESA_CONSUMER_KEY}
mpesa.consumer-secret=${MPESA_CONSUMER_SECRET}
mpesa.pass-key=${MPESA_PASS_KEY}
mpesa.short-code=${MPESA_SHORT_CODE}
mpesa.callback-url=${MPESA_CALLBACK_URL:http://localhost:8080/api/payments/mpesa/callback}
mpesa.auth-url=https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials
mpesa.stk-push-url=https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest
mpesa.query-url=https://sandbox.safaricom.co.ke/mpesa/stkpushquery/v1/query
mpesa.timeout=30

server.port=8080

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true
management.tracing.sampling.probability=0.1
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

resilience4j.circuitbreaker.instances.productService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.productService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.productService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.productService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.productService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.productService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.productService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productService.eventConsumerBufferSize=10

resilience4j.circuitbreaker.instances.elasticsearchService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.elasticsearchService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.elasticsearchService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.elasticsearchService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.elasticsearchService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.elasticsearchService.failureRateThreshold=60

resilience4j.circuitbreaker.instances.mpesaService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.mpesaService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.mpesaService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.mpesaService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.mpesaService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.mpesaService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.mpesaService.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.mpesaService.slowCallDurationThreshold=5s

resilience4j.retry.instances.productSearch.maxAttempts=3
resilience4j.retry.instances.productSearch.waitDuration=1000
resilience4j.retry.instances.productSearch.retryExceptions=org.springframework.web.client.RestClientException

resilience4j.retry.instances.mpesaPayment.maxAttempts=3
resilience4j.retry.instances.mpesaPayment.waitDuration=2000
resilience4j.retry.instances.mpesaPayment.exponentialBackoffMultiplier=2
resilience4j.retry.instances.mpesaPayment.retryExceptions=org.springframework.web.client.RestClientException

resilience4j.ratelimiter.instances.productApi.limitForPeriod=100
resilience4j.ratelimiter.instances.productApi.limitRefreshPeriod=1m
resilience4j.ratelimiter.instances.productApi.timeoutDuration=5s

logging.level.root=INFO
logging.level.com.picknquicks=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
