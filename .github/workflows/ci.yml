name: CI

on:
  push:
    branches: [ main, development, auth, feature/** ]
  pull_request:
    branches: [ main, development ]

env:
  JAVA_VERSION: '21'

jobs:
  # ============================================
  # Job 1: Build & Test
  # ============================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pnq
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d pnq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        env:
          POSTGRES_DB: pnq
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          JWT_SECRET: ci-test-secret-key-that-is-long-enough-for-hmac-sha
          GOOGLE_CLIENT_ID: fake-client-id
          GOOGLE_CLIENT_SECRET: fake-client-secret
          RESEND_API_KEY: re_fake_key
          FRONTEND_URL: http://localhost:3000
          BACKEND_URL: http://localhost:8080
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/pnq
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
        run: mvn clean package -B -Dsurefire.failIfNoSpecifiedTests=false -DskipTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  # ============================================
  # Job 2: Docker Build
  # ============================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t picknquicks:${{ github.sha }} .
