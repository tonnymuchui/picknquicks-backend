version: '3.8'

services:
  backend:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: picknquicks
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/pnq
      - SPRING_DATASOURCE_USERNAME=tonnymuchui
      - SPRING_DATASOURCE_PASSWORD=Muchui22$$
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - LOGGING_LEVEL_COM_ECOMMERCE=DEBUG
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - picknquicks-network

  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: pnq
      POSTGRES_USER: tonnymuchui
      POSTGRES_PASSWORD: Muchui22$$
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - picknquicks-network

volumes:
  postgres_data:

networks:
  picknquicks-network:
    driver: bridge